name: Build VST3

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package macOS VST3
        run: |
          cd build/StereoTo714_artefacts/Release/VST3
          ditto -c -k --sequesterRsrc --keepParent \
            "Stereo to 7.1.4.vst3" \
            "${{ github.workspace }}/StereoTo714-macos-universal.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: StereoTo714-vst3-macos-universal
          path: StereoTo714-macos-universal.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Windows VST3
        shell: pwsh
        run: |
          Compress-Archive -Path "build/StereoTo714_artefacts/Release/VST3/Stereo to 7.1.4.vst3" `
            -DestinationPath "StereoTo714-windows.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: StereoTo714-vst3-windows
          path: StereoTo714-windows.zip
          if-no-files-found: error
